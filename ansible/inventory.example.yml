# Copy to inventory.yml (gitignored: it holds range credentials) and fill in from the handout.
all:
  children:
    linux:
      hosts:
        web01: { ansible_host: 100.80.0.10 }
      vars:
        ansible_user: root             # or a sudo user; playbooks use become
        # ansible_password: in inventory.yml only, or use ansible-vault
    windows:
      hosts:
        dc01: { ansible_host: 100.80.0.20 }
      vars:
        ansible_user: Administrator
        # ansible_password: in inventory.yml only, or use ansible-vault
