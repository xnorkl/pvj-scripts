# Run every read-only hunt script on every host and fetch the findings to
# findings/<run>/<host>/<script>.tsv  (TSV, no header: status check object detail)
# Scripts are re-copied each run, so a Red-tampered copy on the host gets overwritten.
# Usage: ansible-playbook hunt.yml [-e run=baseline]   then: diff -r findings/<a> findings/<b>
- name: Pick one run id for every host
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.set_fact:
        run_id: "{{ run | default(lookup('pipe', 'date +%Y%m%d-%H%M%S')) }}"

- name: Hunt Linux
  hosts: linux
  become: true
  gather_facts: false
  vars:
    dest: /opt/pvj/hunt
    out: /opt/pvj/findings
  tasks:
    - ansible.builtin.copy: { src: ../linux/hunt/, dest: "{{ dest }}/", mode: "0700" }
    - ansible.builtin.file: { path: "{{ out }}", state: directory, mode: "0700" }
    - name: Run hunts (rc 2 = findings, not an error)
      ansible.builtin.shell: |
        rc=0
        for s in {{ dest }}/get-*.sh; do
          n=$(basename "$s" .sh)
          "$s" > "{{ out }}/$n.tsv" || { r=$?; [ "$r" -eq 2 ] || { echo "$n failed rc=$r" >&2; rc=1; }; }
          echo "$n: $(grep -c '^FAIL' "{{ out }}/$n.tsv") FAIL, $(grep -c '^WARN' "{{ out }}/$n.tsv") WARN"
        done
        exit $rc
      changed_when: false
    - ansible.builtin.find: { paths: "{{ out }}", patterns: "*.tsv" }
      register: found
    - ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ playbook_dir }}/../findings/{{ hostvars.localhost.run_id }}/{{ inventory_hostname }}/"
        flat: true
      loop: "{{ found.files }}"
    - name: Don't leave findings on the box for Red to read
      ansible.builtin.file: { path: "{{ out }}", state: absent }

- name: Hunt Windows
  hosts: windows
  gather_facts: false
  vars:
    dest: C:\pvj\hunt
    out: C:\pvj\findings
  tasks:
    - ansible.windows.win_copy: { src: ../windows/hunt/, dest: "{{ dest }}\\" }
    - name: Run hunts (rc 2 = findings, not an error)
      ansible.windows.win_shell: |
        New-Item -ItemType Directory -Force '{{ out }}' | Out-Null
        $rc = 0
        foreach ($s in Get-ChildItem '{{ dest }}\Get-*.ps1') {
            $global:LASTEXITCODE = 0
            try { $r = @(& $s.FullName) } catch { Write-Error "$($s.BaseName) failed: $_"; $rc = 1; continue }
            if ($LASTEXITCODE -eq 1) { $rc = 1 }
            # same TSV as Linux: no header, no quotes, tabs/newlines flattened
            $r | ForEach-Object { ($_.PSObject.Properties.Value -replace "[`t`r`n]+", ' ') -join "`t" } |
                Set-Content "{{ out }}\$($s.BaseName).tsv"
            "$($s.BaseName): $(@($r | Where-Object Status -eq FAIL).Count) FAIL, $(@($r | Where-Object Status -eq WARN).Count) WARN"
        }
        exit $rc
      changed_when: false
    - ansible.windows.win_find: { paths: "{{ out }}", patterns: ["*.tsv"] }
      register: found
    - ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ playbook_dir }}/../findings/{{ hostvars.localhost.run_id }}/{{ inventory_hostname }}/"
        flat: true
      loop: "{{ found.files }}"
    - name: Don't leave findings on the box for Red to read
      ansible.windows.win_file: { path: "{{ out }}", state: absent }
